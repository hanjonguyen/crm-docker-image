name: Đúc image Frappe CRM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Lấy mã của kho này (chứa apps.json)
        uses: actions/checkout@v4

      - name: Dọn chỗ trống trên máy build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Lấy bộ build chính thức của Frappe
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Bật Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy lên ghcr
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crm-docker-image:latest
            ghcr.io/${{ github.repository_owner }}/crm-docker-image:v1
          build-args: |
            FRAPPE_BRANCH=version-15
            FRAPPE_PATH=https://github.com/frappe/frappe
          # ĐIỂM MẤU CHỐT: Containerfile đọc danh sách app qua BuildKit secret,
          # KHÔNG qua --build-arg APPS_JSON_BASE64 (đây là lỗi của kho frappe/crm).
          secret-files: |
            apps_json=./apps.json

      - name: Kiểm chứng image có đủ app crm
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/crm-docker-image:v1
          echo "=== apps.txt trong image ==="
          docker run --rm --entrypoint bash ghcr.io/${{ github.repository_owner }}/crm-docker-image:v1 \
            -c "cat sites/apps.txt"
          echo "=== kiểm tra module python crm ==="
          # PHẢI gọi python của bench (env/bin/python), không phải python hệ thống —
          # app crm cài dạng editable vào virtualenv của bench nên python hệ thống không thấy.
          docker run --rm --entrypoint bash ghcr.io/${{ github.repository_owner }}/crm-docker-image:v1 \
            -c "/home/frappe/frappe-bench/env/bin/python -c 'import crm, frappe; print(\"OK - crm:\", crm.__file__); print(\"frappe:\", frappe.__version__)'"
