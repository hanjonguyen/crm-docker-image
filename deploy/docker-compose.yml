# Frappe CRM — bench RIÊNG, chạy song song với LMS trên cùng máy chủ.
# LMS chạy Frappe 16, CRM chạy Frappe 15 → bắt buộc tách bench, tách mạng, tách CSDL.
# Đã siết bộ nhớ (buffer pool 128M, redis 64mb) vì máy chỉ còn ~1,4 GB RAM trống.
x-image: &image ghcr.io/hanjonguyen/crm-docker-image:v1

x-backend-defaults: &backend_defaults
  image: *image
  networks:
    - crm_network
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  backend:
    <<: *backend_defaults
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  configurator:
    image: *image
    networks:
      - crm_network
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy

  create-site:
    image: *image
    networks:
      - crm_network
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 180 db:3306;
        wait-for-it -t 180 redis-cache:6379;
        wait-for-it -t 180 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Cho sites/common_site_config.json duoc tao";
          sleep 5;
          if (( `date +%s`-start > 180 )); then
            echo "Khong tim thay common_site_config.json";
            exit 1
          fi
        done;
        echo "Da co common_site_config.json";
        if [ -d "sites/crm.diemthuy.vn" ]; then
          echo "Site crm.diemthuy.vn da ton tai, bo qua buoc tao";
        else
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$$ADMIN_PASSWORD" \
            --db-root-username=root \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --install-app crm \
            --set-default crm.diemthuy.vn;
        fi;
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    networks:
      - crm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=128M
      - --performance-schema=0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: *image
    networks:
      - crm_network
    restart: unless-stopped
    depends_on:
      - websocket
      - backend
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: crm.diemthuy.vn
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 200m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      # Cổng 3000 là của LMS, 3001 của sub.diemthuy.vn → CRM lấy 3002.
      - "127.0.0.1:3002:8080"

  queue:
    <<: *backend_defaults
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  scheduler:
    <<: *backend_defaults
    command: ["bench", "schedule"]

  websocket:
    <<: *backend_defaults
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - crm_network
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - crm_network
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  sites:
  logs:
  redis-queue-data:

networks:
  crm_network:
    name: crm_network
